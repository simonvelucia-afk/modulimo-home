      var nip = normaliserNip(champ.value);
      if (nip.length < NIP_MIN) { msg.textContent = "Access code too short."; return; }
      go.disabled = true; go.textContent = "Checking…";
      deriver(nip).then(ouvrir).catch(function () {
        go.disabled = false; go.textContent = "Enter";
        msg.textContent = "Incorrect access code."; champ.select();
      });
    });
  })();
  </script>
</body>
</html>
