<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" font-family="'Segoe UI', Arial, sans-serif">
  <!-- fond -->
  <rect width="800" height="1000" fill="#f4f3f0"/>

  <!-- ── COUPE DU BÂTIMENT ── -->
  <!-- enveloppe -->
  <rect x="50" y="110" width="380" height="800" rx="4" fill="#ffffff" stroke="#2b3a4a" stroke-width="3"/>
  <!-- toiture -->
  <rect x="50" y="110" width="380" height="22" fill="#2b3a4a"/>
  <!-- puits central (vide de la cage d'escalier) -->
  <rect x="195" y="132" width="90" height="776" fill="#eef4ef"/>
  <!-- volées d'escalier suggérées (gauche) -->
  <g stroke="#d8d4cc" stroke-width="3" fill="none">
    <polyline points="62,388 90,388 90,360 118,360 118,332 146,332 146,304 174,304 174,276"/>
    <polyline points="62,646 90,646 90,618 118,618 118,590 146,590 146,562 174,562 174,534"/>
    <polyline points="62,904 90,904 90,876 118,876 118,848 146,848 146,820 174,820 174,792"/>
  </g>
  <!-- planchers (interrompus par le puits) -->
  <g fill="#2b3a4a">
    <rect x="53" y="391" width="142" height="14"/>
    <rect x="285" y="391" width="142" height="14"/>
    <rect x="53" y="650" width="142" height="14"/>
    <rect x="285" y="650" width="142" height="14"/>
  </g>
  <!-- étiquettes d'étages -->
  <g fill="#9a958c" font-size="13" font-weight="600">
    <text x="64" y="215">3e ÉTAGE</text>
    <text x="64" y="420">2e ÉTAGE</text>
    <text x="64" y="679">1er ÉTAGE</text>
  </g>

  <!-- poutrelle + monorail -->
  <rect x="110" y="148" width="260" height="14" fill="#1f3a5f"/>
  <g fill="#9a958c" font-size="11">
    <text x="116" y="143">poutrelle + monorail</text>
  </g>
  <!-- chariot -->
  <rect x="222" y="162" width="36" height="10" rx="2" fill="#3a7a52"/>
  <!-- palan -->
  <rect x="228" y="172" width="24" height="22" rx="3" fill="#55606b"/>
  <!-- câble -->
  <line x1="240" y1="194" x2="240" y2="430" stroke="#55606b" stroke-width="3"/>
  <!-- sangles -->
  <line x1="240" y1="430" x2="208" y2="466" stroke="#55606b" stroke-width="2"/>
  <line x1="240" y1="430" x2="272" y2="466" stroke="#55606b" stroke-width="2"/>
  <!-- sofa hissé -->
  <g>
    <rect x="200" y="446" width="80" height="26" rx="8" fill="#c9a47e"/>
    <rect x="200" y="466" width="80" height="22" rx="6" fill="#b08968"/>
    <rect x="196" y="456" width="12" height="32" rx="5" fill="#b08968"/>
    <rect x="272" y="456" width="12" height="32" rx="5" fill="#b08968"/>
  </g>

  <!-- garde-corps aux paliers (fermés) -->
  <g stroke="#3a7a52" stroke-width="3">
    <line x1="178" y1="391" x2="178" y2="357"/>
    <line x1="190" y1="391" x2="190" y2="357"/>
    <line x1="170" y1="357" x2="195" y2="357"/>
    <line x1="178" y1="650" x2="178" y2="616"/>
    <line x1="190" y1="650" x2="190" y2="616"/>
    <line x1="170" y1="616" x2="195" y2="616"/>
  </g>
  <!-- garde-corps ouvert (palier 2e, côté droit) -->
  <g stroke="#3a7a52" stroke-width="3">
    <line x1="293" y1="650" x2="293" y2="614"/>
    <line x1="293" y1="614" x2="326" y2="600" stroke-dasharray="6 5"/>
  </g>

  <!-- repères numérotés -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <circle cx="385" cy="155" r="13" fill="#3a7a52"/><text x="385" y="160" fill="#ffffff">1</text>
    <circle cx="285" cy="183" r="13" fill="#3a7a52"/><text x="285" y="188" fill="#ffffff">2</text>
    <circle cx="338" cy="632" r="13" fill="#3a7a52"/><text x="338" y="637" fill="#ffffff">3</text>
    <circle cx="240" cy="868" r="13" fill="#3a7a52"/><text x="240" y="873" fill="#ffffff">4</text>
  </g>

  <!-- ── PANNEAU D'INFORMATION ── -->
  <rect x="465" y="110" width="295" height="800" rx="12" fill="#ffffff" stroke="#e0ddd6"/>
  <text x="487" y="160" font-size="25" font-weight="800" fill="#1f3a5f">SYSTÈME DE</text>
  <text x="487" y="192" font-size="25" font-weight="800" fill="#1f3a5f">LEVAGE RÉSIDENTIEL</text>
  <text x="487" y="222" font-size="14" font-weight="600" fill="#3a7a52">DANS LA CAGE D'ESCALIER · 3 ÉTAGES</text>
  <line x1="487" y1="244" x2="738" y2="244" stroke="#e0ddd6" stroke-width="2"/>

  <g font-size="15">
    <circle cx="500" cy="284" r="13" fill="#3a7a52"/>
    <text x="500" y="289" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
    <text x="524" y="280" font-weight="700" fill="#1f3a5f">Poutrelle + monorail</text>
    <text x="524" y="300" font-size="13" fill="#666">Au sommet du puits central,</text>
    <text x="524" y="318" font-size="13" fill="#666">intégrés à la structure.</text>

    <circle cx="500" cy="368" r="13" fill="#3a7a52"/>
    <text x="500" y="373" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
    <text x="524" y="364" font-weight="700" fill="#1f3a5f">Palan électrique partagé</text>
    <text x="524" y="384" font-size="13" fill="#666">Réservation via CoHabitat —</text>
    <text x="524" y="402" font-size="13" fill="#666">meubles et électroménagers.</text>

    <circle cx="500" cy="452" r="13" fill="#3a7a52"/>
    <text x="500" y="457" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
    <text x="524" y="448" font-weight="700" fill="#1f3a5f">Garde-corps ouvrants</text>
    <text x="524" y="468" font-size="13" fill="#666">Verrouillés au quotidien,</text>
    <text x="524" y="486" font-size="13" fill="#666">ouverts le jour du levage.</text>

    <circle cx="500" cy="536" r="13" fill="#3a7a52"/>
    <text x="500" y="541" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
    <text x="524" y="532" font-weight="700" fill="#1f3a5f">Tous les étages desservis</text>
    <text x="524" y="552" font-size="13" fill="#666">Déménagements et charges</text>
    <text x="524" y="570" font-size="13" fill="#666">lourdes, à l'abri des intempéries.</text>
  </g>

  <!-- encadré avantages -->
  <rect x="487" y="612" width="251" height="252" rx="10" fill="#1f3a5f"/>
  <g fill="#ffffff">
    <text x="507" y="652" font-size="14" font-weight="700">CAPACITÉ</text>
    <text x="507" y="672" font-size="12.5" fill="#c7d2de">≈ 300 à 500 kg</text>
    <text x="507" y="708" font-size="14" font-weight="700">SÉCURITAIRE</text>
    <text x="507" y="728" font-size="12.5" fill="#c7d2de">Ancrages certifiés, usage encadré</text>
    <text x="507" y="764" font-size="14" font-weight="700">ÉCONOMIQUE</text>
    <text x="507" y="784" font-size="12.5" fill="#c7d2de">Une fraction du coût d'un</text>
    <text x="507" y="800" font-size="12.5" fill="#c7d2de">monte-charge traditionnel</text>
    <text x="507" y="836" font-size="14" font-weight="700">QUATRE SAISONS</text>
    <text x="507" y="856" font-size="12.5" fill="#c7d2de">Levage intérieur, hiver comme été</text>
  </g>

  <!-- note conceptuelle -->
  <text x="400" y="952" font-size="12.5" font-style="italic" fill="#9a958c" text-anchor="middle">Illustration conceptuelle — la conception sera finalisée avec l'architecte mandaté.</text>
</svg>
