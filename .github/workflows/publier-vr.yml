# =============================================================================
# Publie la visite 3D / VR de Pointe Est sur modulimo.com/vr/, CHIFFRÉE avec
# le code du cadenas (même clé que la page Produits). Voir build.js → publierVr.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   MODULIMO_PIN  le code d'accès actuel du cadenas
#   VR_TOKEN      jeton GitHub « fine-grained » : accès au seul dépôt
#                 simonvelucia-afk/modulimo-vr, permission Contents = Read-only
#
# Lancement : onglet Actions → « Publier la visite VR » → Run workflow
# (un « Re-run » fonctionne aussi : le build part toujours du dernier main).
# Garde-fou : si MODULIMO_PIN ne correspond pas au cadenas actuel, build.js
# régénérerait verrou.json (nouveau sel) et casserait Produits : le workflow
# s'arrête alors sans rien publier.
# =============================================================================
name: Publier la visite VR

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publier-vr]

permissions:
  contents: write

concurrency:
  group: publier-vr
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Site modulimo-home (toujours la dernière version de main, même en « Re-run »)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Source privée de la visite (modulimo-vr)
        uses: actions/checkout@v5
        with:
          repository: simonvelucia-afk/modulimo-vr
          token: ${{ secrets.VR_TOKEN }}
          path: _modulimo-vr

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Générer vr/ (chiffré)
        env:
          MODULIMO_PIN: ${{ secrets.MODULIMO_PIN }}
          MODULIMO_VR: _modulimo-vr
        run: |
          if [ -z "$MODULIMO_PIN" ]; then echo "::error::Secret MODULIMO_PIN manquant"; exit 1; fi
          node build.js
          if ! git diff --quiet -- verrou.json; then
            echo "::error::MODULIMO_PIN ne correspond pas au cadenas actuel (verrou.json aurait changé). Rien n'est publié."
            exit 1
          fi
          echo "VR_SHA=$(git -C _modulimo-vr rev-parse --short HEAD)" >> "$GITHUB_ENV"
          rm -rf _modulimo-vr

      - name: Publier (seulement vr/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add vr
          if git diff --cached --quiet; then echo "Visite déjà à jour."; exit 0; fi
          git commit -m "Visite VR : publication chiffrée (modulimo-vr@${VR_SHA})"
          # build.js régénère aussi les autres pages et sitemap.xml (date du jour) :
          # on ne publie que vr/, on jette donc le reste avant de se synchroniser.
          git reset -q --hard HEAD
          git clean -fdq
          # Si main a bougé pendant le build : on se remet à jour avant de pousser.
          # En cas de conflit sur vr/, notre nouvelle publication l'emporte (-X theirs
          # = le commit rejoué pendant le rebase). Jusqu'à 3 essais.
          for essai in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "Push refusé (essai $essai), nouvel essai dans 5 s…"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Impossible de pousser vers main après 3 essais."
          exit 1
